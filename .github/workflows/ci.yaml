name: Build

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out jbang-vscode
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          path: jbang-vscode

      - name: Check out jbang-eclipse
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: jbangdev/jbang-eclipse
          fetch-depth: 0
          path: jbang-eclipse

      - name: Set Up NodeJS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Set Up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Install requirements
        working-directory: ./jbang-vscode
        run: |
          npm ci
          npm install -g typescript "@vscode/vsce"

      - name: Build server
        working-directory: ./jbang-vscode
        run: npm run build-ext

      - name: Build vsix
        working-directory: ./jbang-vscode
        run: |
          node ./scripts/create-package-insiders-json.js
          mv ./package.insiders.json ./package.json
          vsce package --pre-release

      - name: Upload vsix
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jbang-vscode
          path: jbang-vscode/*.vsix
